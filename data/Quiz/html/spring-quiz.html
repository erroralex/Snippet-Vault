<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenta-Quiz — Spring Boot & Mikrotjänster</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #0d1117;
  --surface:    #161b22;
  --surface2:   #1e2530;
  --surface3:   #252d3a;
  --border:     #30363d;
  --border2:    #3d444d;
  --green:      #3fb950;
  --green-dim:  #1a4726;
  --green-glow: rgba(63,185,80,.15);
  --blue:       #58a6ff;
  --blue-dim:   #0d2845;
  --orange:     #f0883e;
  --orange-dim: #3d2007;
  --purple:     #bc8cff;
  --purple-dim: #2d1f4e;
  --red:        #ff7b72;
  --red-dim:    #3d1010;
  --yellow:     #e3b341;
  --yellow-dim: #3a2a00;
  --text:       #e6edf3;
  --text2:      #c9d1d9;
  --muted:      #8b949e;
  --mono:       'JetBrains Mono', monospace;
  --sans:       'DM Sans', sans-serif;
  --r:          10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  min-height: 100vh;
}

/* ── GRID BACKGROUND ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(48,54,61,.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(48,54,61,.3) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* ── LAYOUT ── */
#app { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 0 24px 80px; }

/* ── HEADER ── */
header {
  padding: 52px 0 40px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 40px;
}
.header-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--green-dim); color: var(--green);
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 4px 12px;
  border-radius: 20px; margin-bottom: 18px;
  border: 1px solid rgba(63,185,80,.3);
  font-family: var(--mono);
}
.header-badge::before { content: '●'; font-size: 8px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

h1 { font-size: 36px; font-weight: 700; line-height: 1.2; margin-bottom: 10px; }
h1 em { color: var(--green); font-style: normal; }
.subtitle { color: var(--muted); font-size: 15px; }

/* ── STATS BAR ── */
#stats-bar {
  display: flex; gap: 16px; flex-wrap: wrap;
  margin-bottom: 32px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px 20px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; flex: 1; min-width: 130px;
}
.stat-num {
  font-family: var(--mono);
  font-size: 22px; font-weight: 700;
}
.stat-label { color: var(--muted); font-size: 12px; }

/* ── PROGRESS ── */
#progress-wrap {
  background: var(--surface2);
  border-radius: 999px;
  height: 6px;
  margin-bottom: 36px;
  overflow: hidden;
}
#progress-bar {
  height: 100%; border-radius: 999px;
  background: linear-gradient(90deg, var(--green), var(--blue));
  transition: width .4s cubic-bezier(.4,0,.2,1);
  width: 0%;
}

/* ── CATEGORY FILTER ── */
#filter-wrap {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
}
.filter-btn {
  padding: 5px 14px; border-radius: 20px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: var(--sans);
}
.filter-btn:hover { color: var(--text); border-color: var(--border2); }
.filter-btn.active { background: var(--green-dim); color: var(--green); border-color: var(--green); }

/* ── QUESTION CARD ── */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 32px;
  margin-bottom: 16px;
  transition: border-color .2s;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.q-card:hover { border-color: var(--border2); }
.q-card.answered { border-color: transparent; }
.q-card.correct  { border-color: var(--green); background: linear-gradient(135deg, var(--surface) 80%, var(--green-dim)); }
.q-card.wrong    { border-color: var(--red);   background: linear-gradient(135deg, var(--surface) 80%, var(--red-dim));   }

/* category tag */
.q-meta {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.q-num {
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  color: var(--muted); background: var(--surface2);
  padding: 2px 8px; border-radius: 4px;
}
.q-cat {
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; padding: 2px 10px; border-radius: 20px;
}
.cat-spring  { background: var(--green-dim);  color: var(--green); }
.cat-data    { background: var(--orange-dim); color: var(--orange); }
.cat-rest    { background: var(--purple-dim); color: var(--purple); }
.cat-micro   { background: var(--blue-dim);   color: var(--blue); }
.cat-security{ background: var(--red-dim);    color: var(--red); }
.cat-oauth   { background: var(--yellow-dim); color: var(--yellow); }
.cat-logging { background: #1a1f2e;           color: #a8b4c8; border: 1px solid #3d4455; }

.q-text {
  font-size: 15px; font-weight: 500; color: var(--text);
  margin-bottom: 20px; line-height: 1.6;
}
.q-text code {
  font-family: var(--mono); font-size: 13px;
  background: var(--surface2); color: var(--orange);
  padding: 1px 6px; border-radius: 4px;
  border: 1px solid var(--border);
}
.q-code {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 18px;
  font-family: var(--mono);
  font-size: 13px; line-height: 1.7;
  color: var(--text2);
  overflow-x: auto;
}

/* ── ANSWER OPTIONS ── */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media(max-width:600px){ .options { grid-template-columns: 1fr; } }

.opt-btn {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  cursor: pointer; text-align: left;
  font-size: 14px; color: var(--text2); font-family: var(--sans);
  transition: all .15s; line-height: 1.5;
  position: relative; overflow: hidden;
}
.opt-btn::before {
  content: ''; position: absolute; inset: 0;
  background: transparent; transition: background .15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--blue); color: var(--text); }
.opt-btn:hover:not(:disabled)::before { background: rgba(88,166,255,.05); }

.opt-letter {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--surface3); border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  color: var(--muted); flex-shrink: 0; margin-top: 1px;
  transition: all .15s;
}
.opt-text { flex: 1; }
.opt-text code {
  font-family: var(--mono); font-size: 12px;
  background: var(--surface); color: var(--orange);
  padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border);
}

/* states */
.opt-btn.correct-ans {
  border-color: var(--green); background: var(--green-dim);
  color: var(--text);
}
.opt-btn.correct-ans .opt-letter {
  background: var(--green); border-color: var(--green);
  color: #0d1117;
}
.opt-btn.wrong-ans {
  border-color: var(--red); background: var(--red-dim);
  color: var(--text);
}
.opt-btn.wrong-ans .opt-letter {
  background: var(--red); border-color: var(--red); color: #fff;
}
.opt-btn:disabled { cursor: default; }

/* ── EXPLANATION ── */
.explanation {
  margin-top: 14px; padding: 12px 16px;
  background: var(--surface2); border-radius: 8px;
  border-left: 3px solid var(--green);
  font-size: 13px; color: var(--text2);
  display: none; animation: fadeIn .2s ease;
}
.explanation.show { display: block; }
.explanation.wrong-exp { border-color: var(--red); }
.explanation strong { color: var(--text); }

/* ── RESULT SCREEN ── */
#result-screen {
  display: none;
  text-align: center;
  padding: 60px 20px;
  animation: fadeIn .5s ease;
}
.result-circle {
  width: 140px; height: 140px; border-radius: 50%;
  border: 4px solid var(--green);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  margin: 0 auto 28px;
  background: var(--green-dim);
  box-shadow: 0 0 40px var(--green-glow);
}
.result-pct { font-size: 42px; font-weight: 800; color: var(--green); font-family: var(--mono); }
.result-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.result-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
.result-sub { color: var(--muted); margin-bottom: 32px; }
.result-breakdown {
  display: flex; justify-content: center; gap: 24px;
  flex-wrap: wrap; margin-bottom: 36px;
}
.rb { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 24px; min-width: 120px; }
.rb-num { font-family: var(--mono); font-size: 28px; font-weight: 700; }
.rb-label { font-size: 12px; color: var(--muted); }
.grade-msg {
  padding: 14px 24px; border-radius: 10px;
  font-weight: 600; font-size: 15px;
  margin-bottom: 28px; display: inline-block;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border-radius: 8px;
  font-weight: 600; font-size: 14px; cursor: pointer;
  border: none; transition: all .15s; font-family: var(--sans);
  text-decoration: none;
}
.btn-primary {
  background: var(--green); color: #0d1117;
}
.btn-primary:hover { background: #56d364; transform: translateY(-1px); }
.btn-ghost {
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover { border-color: var(--border2); background: var(--surface3); }

/* ── CONTROLS ROW ── */
#controls {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
  padding: 16px 0; margin-bottom: 8px;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── CHAPTER DIVIDER ── */
.chapter-divider {
  display: flex; align-items: center; gap: 12px;
  margin: 36px 0 20px;
}
.chapter-divider-line { flex: 1; height: 1px; background: var(--border); }
.chapter-divider-label {
  font-size: 12px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
  padding: 4px 14px; border-radius: 20px;
  background: var(--surface); border: 1px solid var(--border);
  white-space: nowrap;
}

/* hidden when quizzing */
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-badge">Systemutveckling Backend</div>
    <h1>Tenta-Quiz<br><em>Spring Boot & Mikrotjänster</em></h1>
    <p class="subtitle">75 frågor · Yrkeshögskola · Frågorna och svarsalternativen randomiseras varje omgång</p>
  </header>

  <!-- STATS -->
  <div id="stats-bar">
    <div class="stat">
      <div>
        <div class="stat-num" id="stat-answered" style="color:var(--blue)">0</div>
        <div class="stat-label">Besvarade</div>
      </div>
    </div>
    <div class="stat">
      <div>
        <div class="stat-num" id="stat-correct" style="color:var(--green)">0</div>
        <div class="stat-label">Rätta svar</div>
      </div>
    </div>
    <div class="stat">
      <div>
        <div class="stat-num" id="stat-wrong" style="color:var(--red)">0</div>
        <div class="stat-label">Fel svar</div>
      </div>
    </div>
    <div class="stat">
      <div>
        <div class="stat-num" id="stat-pct" style="color:var(--yellow)">—</div>
        <div class="stat-label">Poäng %</div>
      </div>
    </div>
    <div class="stat">
      <div>
        <div class="stat-num" id="stat-left" style="color:var(--muted)">75</div>
        <div class="stat-label">Kvar</div>
      </div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div id="progress-wrap"><div id="progress-bar"></div></div>

  <!-- CONTROLS -->
  <div id="controls">
    <div id="filter-wrap">
      <button class="filter-btn active" data-cat="all">Alla</button>
      <button class="filter-btn" data-cat="spring">Spring Boot</button>
      <button class="filter-btn" data-cat="data">Data &amp; JPA</button>
      <button class="filter-btn" data-cat="rest">REST</button>
      <button class="filter-btn" data-cat="micro">Mikrotjänster</button>
      <button class="filter-btn" data-cat="security">Säkerhet</button>
      <button class="filter-btn" data-cat="oauth">OAuth</button>
      <button class="filter-btn" data-cat="logging">Loggning</button>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" id="btn-shuffle">↺ Blanda om</button>
      <button class="btn btn-primary" id="btn-finish">Avsluta quiz</button>
    </div>
  </div>

  <!-- QUIZ AREA -->
  <div id="quiz-area"></div>

  <!-- RESULT SCREEN -->
  <div id="result-screen">
    <div class="result-circle">
      <div class="result-pct" id="res-pct">0%</div>
      <div class="result-label">Poäng</div>
    </div>
    <h2 class="result-title" id="res-title"></h2>
    <p class="result-sub" id="res-sub"></p>
    <div class="result-breakdown">
      <div class="rb">
        <div class="rb-num" id="res-correct" style="color:var(--green)">0</div>
        <div class="rb-label">Rätt</div>
      </div>
      <div class="rb">
        <div class="rb-num" id="res-wrong" style="color:var(--red)">0</div>
        <div class="rb-label">Fel</div>
      </div>
      <div class="rb">
        <div class="rb-num" id="res-skipped" style="color:var(--muted)">0</div>
        <div class="rb-label">Ej besvarade</div>
      </div>
    </div>
    <div class="grade-msg" id="res-grade"></div><br>
    <button class="btn btn-primary" id="btn-restart" style="margin-top:12px">↺ Gör om quizet</button>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════
// QUESTION BANK — 75 questions
// ═══════════════════════════════════════════════════
const QUESTIONS = [

// ───────────────── SPRING BOOT (1-20) ─────────────────
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vad innebär Inversion of Control (IoC) i Spring?',
  opts: [
    { t: 'Ramverket ansvarar för att skapa och koppla ihop objekt åt dig', correct: true },
    { t: 'Du skapar alla objekt manuellt med <code>new</code>-nyckelordet', correct: false },
    { t: 'Kontrollflödet i programmet styrs uppifrån och ned', correct: false },
    { t: 'Applikationen konfigureras enbart via XML-filer', correct: false },
  ],
  exp: 'IoC innebär att <strong>ramverket</strong> (Spring) tar kontroll och ansvarar för objektens livscykel — skapar, kopplar ihop och förstör objekt åt dig via sin IoC-container.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vilken typ av Dependency Injection är rekommenderad best practice i Spring Boot?',
  opts: [
    { t: 'Fält-injektion med <code>@Autowired</code> direkt på fält', correct: false },
    { t: 'Konstruktor-injektion via konstruktor-argument', correct: true },
    { t: 'Setter-injektion via setter-metoder med <code>@Autowired</code>', correct: false },
    { t: 'Interface-injektion via separata konfigurationsinterface', correct: false },
  ],
  exp: '<strong>Konstruktor-injektion</strong> är best practice — den är testbar, explicit, möjliggör immutabilitet (final-fält) och gör beroendena synliga vid kompilering.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vad gör annotationen <code>@SpringBootApplication</code>?',
  opts: [
    { t: 'Aktiverar enbart Spring MVC och embedded Tomcat', correct: false },
    { t: 'Kombinerar <code>@Configuration</code>, <code>@EnableAutoConfiguration</code> och <code>@ComponentScan</code>', correct: true },
    { t: 'Definierar en Spring Bean och aktiverar Component Scan', correct: false },
    { t: 'Startar en inbäddad databas och konfigurerar JPA automatiskt', correct: false },
  ],
  exp: '<code>@SpringBootApplication</code> är en bekväm sammansättning av tre annotationer: <code>@Configuration</code>, <code>@EnableAutoConfiguration</code> och <code>@ComponentScan</code>.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vad är skillnaden mellan <code>@Controller</code> och <code>@RestController</code>?',
  opts: [
    { t: '<code>@RestController</code> stödjer bara GET-requests, <code>@Controller</code> stödjer alla HTTP-metoder', correct: false },
    { t: '<code>@RestController</code> är <code>@Controller</code> + <code>@ResponseBody</code> — returnerar direkt JSON/XML', correct: true },
    { t: 'Det finns ingen skillnad, de är helt synonyma annotationer i moderna Spring-versioner', correct: false },
    { t: '<code>@Controller</code> hanterar REST och <code>@RestController</code> hanterar HTML-sidor', correct: false },
  ],
  exp: '<code>@RestController</code> kombinerar <code>@Controller</code> och <code>@ResponseBody</code>, vilket innebär att returvärden serialiseras till JSON/XML direkt utan att behöva <code>@ResponseBody</code> på varje metod.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vad är en "Bean" i Spring Boot?',
  opts: [
    { t: 'En Java-klass som implementerar <code>Serializable</code>-interfacet', correct: false },
    { t: 'Ett objekt som Springs IoC-container skapar, konfigurerar och hanterar livscykeln för', correct: true },
    { t: 'En databas-entitet som mappas till en databastabell med JPA', correct: false },
    { t: 'En konfigurationsfil i YAML-format som läses vid uppstart', correct: false },
  ],
  exp: 'En <strong>Bean</strong> är ett objekt som Springs IoC-container skapar och hanterar. Klasser märkta med <code>@Component</code>, <code>@Service</code>, <code>@Repository</code>, <code>@Controller</code> eller metoder märkta med <code>@Bean</code> blir beans.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vilken annotation används för att läsa in ett enstaka konfigurationsvärde från <code>application.properties</code>?',
  opts: [
    { t: '<code>@ConfigurationProperties(prefix="app")</code>', correct: false },
    { t: '<code>@Value("${app.name}")</code>', correct: true },
    { t: '<code>@PropertySource("app.name")</code>', correct: false },
    { t: '<code>@Resource(name="app.name")</code>', correct: false },
  ],
  exp: '<code>@Value("${nyckel}")</code> används för att injicera enstaka värden. För att läsa in en grupp av relaterade värden används <code>@ConfigurationProperties(prefix="...")</code>.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vilket lager i Spring Boot-arkitekturen ansvarar för affärslogiken?',
  opts: [
    { t: 'Controller-lagret med <code>@RestController</code>', correct: false },
    { t: 'Repository-lagret med <code>@Repository</code>', correct: false },
    { t: 'Service-lagret med <code>@Service</code>', correct: true },
    { t: 'Konfigurationslagret med <code>@Configuration</code>', correct: false },
  ],
  exp: '<strong>Service-lagret</strong> (annoterat med <code>@Service</code>) innehåller affärslogiken. Controller-lagret hanterar HTTP, Repository-lagret hanterar dataåtkomst.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vad är skillnaden mellan <code>@Component</code> och <code>@Service</code>?',
  opts: [
    { t: '<code>@Service</code> skapar en singleton medan <code>@Component</code> skapar en ny instans varje gång', correct: false },
    { t: 'De är tekniskt synonyma men <code>@Service</code> är semantiskt avsedd för affärslogik-klasser', correct: true },
    { t: '<code>@Component</code> kan bara användas i test-klasser, <code>@Service</code> i produktionskod', correct: false },
    { t: '<code>@Service</code> kräver att klassen implementerar ett interface, <code>@Component</code> gör det inte', correct: false },
  ],
  exp: 'Tekniskt sett är <code>@Service</code> en specialisering av <code>@Component</code> och registreras på samma sätt i IoC-containern. Skillnaden är semantisk — <code>@Service</code> signalerar att klassen innehåller affärslogik.'
},
{
  cat: 'spring', catLabel: 'Spring Boot',
  q: 'Vilket starters-paket inkluderar Jackson (JSON) och embedded Tomcat?',
  opts: [
    { t: '<code>spring-boot-starter-data-jpa</code>', correct: false },
    { t: '<code>spring-boot-starter-web</code>', correct: true },
    { t: '<code>spring-boot-starter-actuator</code>', correct: false },
    { t: '<code>spring-boot-starter-security</code>', correct: false },
  ],
  exp: '<code>spring-boot-starter-web</code> inkluderar Spring MVC, embedded Tomcat och Jackson för JSON-serialisering.'

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let state = {
  questions: [],
  answers: {}, // qIndex -> { chosen, correct }
  filter: 'all'
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz() {
  state.answers = {};
  const base = state.filter === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.cat === state.filter);
  state.questions = shuffle(base).map(q => ({
    ...q,
    opts: shuffle(q.opts.map((o, i) => ({ ...o, origIdx: i })))
  }));
  renderQuiz();
  updateStats();
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('progress-wrap').style.display = 'block';
}

function renderQuiz() {
  const area = document.getElementById('quiz-area');
  area.innerHTML = '';

  const catOrder = ['spring','data','rest','micro','security','oauth','logging'];
  const catLabel = { spring:'Spring Boot', data:'Data & JPA', rest:'REST', micro:'Mikrotjänster', security:'Säkerhet', oauth:'OAuth 2.0', logging:'Loggning' };
  let lastCat = null;

  state.questions.forEach((q, idx) => {
    if (q.cat !== lastCat) {
      if (state.filter === 'all') {
        const div = document.createElement('div');
        div.className = 'chapter-divider';
        div.innerHTML = `<div class="chapter-divider-line"></div><div class="chapter-divider-label">${catLabel[q.cat] || q.catLabel}</div><div class="chapter-divider-line"></div>`;
        area.appendChild(div);
      }
      lastCat = q.cat;
    }
    area.appendChild(buildCard(q, idx));
  });
}

const LETTERS = ['A','B','C','D'];
const CAT_CLASS = { spring:'cat-spring', data:'cat-data', rest:'cat-rest', micro:'cat-micro', security:'cat-security', oauth:'cat-oauth', logging:'cat-logging' };

function buildCard(q, idx) {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = `qcard-${idx}`;

  const ans = state.answers[idx];
  if (ans) {
    card.classList.add('answered', ans.correct ? 'correct' : 'wrong');
  }

  card.innerHTML = `
    <div class="q-meta">
      <span class="q-num">#${String(idx + 1).padStart(2,'0')}</span>
      <span class="q-cat ${CAT_CLASS[q.cat] || ''}">${q.catLabel}</span>
    </div>
    <div class="q-text">${q.q}</div>
    <div class="options" id="opts-${idx}">
      ${q.opts.map((opt, oi) => `
        <button class="opt-btn${ans ? (opt.correct ? ' correct-ans' : (ans.chosen === oi ? ' wrong-ans' : '')) : ''}"
          id="opt-${idx}-${oi}"
          ${ans ? 'disabled' : ''}
          onclick="answer(${idx}, ${oi})">
          <span class="opt-letter">${LETTERS[oi]}</span>
          <span class="opt-text">${opt.t}</span>
        </button>
      `).join('')}
    </div>
    <div class="explanation${ans ? ' show' : ''}${ans && !ans.correct ? ' wrong-exp' : ''}" id="exp-${idx}">
      ${ans ? (ans.correct ? '✅ ' : '❌ ') + q.exp : q.exp}
    </div>
  `;
  return card;
}

function answer(qIdx, optIdx) {
  const q = state.questions[qIdx];
  const chosen = q.opts[optIdx];
  const correct = chosen.correct;

  state.answers[qIdx] = { chosen: optIdx, correct };

  // update card
  const card = document.getElementById(`qcard-${qIdx}`);
  card.classList.add('answered', correct ? 'correct' : 'wrong');

  q.opts.forEach((opt, oi) => {
    const btn = document.getElementById(`opt-${qIdx}-${oi}`);
    btn.disabled = true;
    if (opt.correct) btn.classList.add('correct-ans');
    else if (oi === optIdx && !correct) btn.classList.add('wrong-ans');
  });

  const exp = document.getElementById(`exp-${qIdx}`);
  exp.innerHTML = (correct ? '✅ ' : '❌ ') + q.exp;
  exp.classList.add('show');
  if (!correct) exp.classList.add('wrong-exp');

  updateStats();
}

function updateStats() {
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const correct = Object.values(state.answers).filter(a => a.correct).length;
  const wrong = answered - correct;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : null;

  document.getElementById('stat-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-pct').textContent = pct !== null ? pct + '%' : '—';
  document.getElementById('stat-left').textContent = total - answered;
  document.getElementById('progress-bar').style.width = (answered / total * 100) + '%';
}

function finishQuiz() {
  const total = state.questions.length;
  const answered = Object.keys(state.answers).length;
  const correct = Object.values(state.answers).filter(a => a.correct).length;
  const skipped = total - answered;
  const pct = Math.round((correct / total) * 100);

  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  document.getElementById('res-pct').textContent = pct + '%';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = answered - correct;
  document.getElementById('res-skipped').textContent = skipped;

  let title, sub, gradeColor, gradeMsg;
  if (pct >= 90) {
    title = 'Utmärkt! 🏆'; sub = 'Du är redo för tentan!';
    gradeColor = 'background:var(--green-dim);color:var(--green);border:1px solid var(--green)';
    gradeMsg = 'Betyg: VG — Imponerande resultat!';
  } else if (pct >= 70) {
    title = 'Bra jobbat! 👍'; sub = 'Du har god förståelse för kursmaterialet.';
    gradeColor = 'background:var(--blue-dim);color:var(--blue);border:1px solid var(--blue)';
    gradeMsg = 'Betyg: G — Läs igenom felen och du är redo.';
  } else if (pct >= 50) {
    title = 'Fortsätt plugga 📚'; sub = 'Du är på rätt väg — mer repetition behövs.';
    gradeColor = 'background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow)';
    gradeMsg = 'Inte riktigt G-nivå ännu — fokusera på de ämnen du missat.';
  } else {
    title = 'Mer plugg behövs 💪'; sub = 'Gå igenom studiehandledningen igen!';
    gradeColor = 'background:var(--red-dim);color:var(--red);border:1px solid var(--red)';
    gradeMsg = 'Läs igenom alla kapitel och gör om quizet.';
  }

  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;
  const rc = document.querySelector('.result-circle');
  const grade = document.getElementById('res-grade');
  grade.setAttribute('style', gradeColor); grade.textContent = gradeMsg;
  if (pct < 70) { rc.style.borderColor = 'var(--red)'; rc.style.background = 'var(--red-dim)'; rc.style.boxShadow = '0 0 40px rgba(255,123,114,.15)'; document.getElementById('res-pct').style.color = 'var(--red)'; }
  else if (pct >= 70 && pct < 90) { rc.style.borderColor = 'var(--blue)'; rc.style.background = 'var(--blue-dim)'; rc.style.boxShadow = '0 0 40px rgba(88,166,255,.15)'; document.getElementById('res-pct').style.color = 'var(--blue)'; }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── EVENTS ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.filter = btn.dataset.cat;
    initQuiz();
  });
});

document.getElementById('btn-shuffle').addEventListener('click', initQuiz);
document.getElementById('btn-finish').addEventListener('click', finishQuiz);
document.getElementById('btn-restart').addEventListener('click', () => { initQuiz(); window.scrollTo({top:0,behavior:'smooth'}); });

// INIT
initQuiz();
</script>
</body>
</html>
