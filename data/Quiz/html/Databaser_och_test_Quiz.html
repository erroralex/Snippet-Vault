<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenta-Quiz Komplett: Java & Databaser</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border: #334155;
            --btn-hover: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 850px;
            padding: 20px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h1 {
            color: var(--accent-blue);
            margin: 0;
            font-size: 2rem;
        }

        /* Stats Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .stat-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; margin-top: 5px; }
        
        .val-green { color: var(--accent-green); }
        .val-red { color: var(--accent-red); }
        .val-blue { color: var(--accent-blue); }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-blue);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background-color: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 16px 20px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            line-height: 1.4;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--btn-hover);
            border-color: var(--accent-blue);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.7;
        }

        /* Feedback states */
        .option-btn.correct {
            background-color: rgba(74, 222, 128, 0.15) !important;
            border-color: var(--accent-green) !important;
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: rgba(248, 113, 113, 0.15) !important;
            border-color: var(--accent-red) !important;
            color: var(--accent-red) !important;
            opacity: 0.5;
        }

        .next-btn {
            margin-top: 25px;
            padding: 12px 30px;
            background-color: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            display: none; 
            float: right;
            transition: opacity 0.2s;
        }

        .next-btn:hover { opacity: 0.9; }

        /* Result Screen */
        .result-screen { text-align: center; display: none; padding-top: 40px;}
        .score-display { font-size: 5rem; font-weight: bold; color: var(--accent-blue); margin: 20px 0; line-height: 1;}
        
        .tag {
            display: inline-block; padding: 4px 8px; border-radius: 4px;
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
            margin-bottom: 15px; background: rgba(255,255,255,0.1); color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .dashboard { grid-template-columns: 1fr; }
            .question-text { font-size: 1.1rem; }
        }

    </style>
</head>

    </div>
</div>

    // ==========================================
    // LOGIC
    // ==========================================
    
    // Fisher-Yates Shuffle
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    let currentQuestionIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let shuffledQuestions = [];

    const ui = {
        question: document.getElementById('question'),
        options: document.getElementById('options'),
        qCounter: document.getElementById('q-counter'),
        correctCountDisplay: document.getElementById('correct-count'),
        wrongCountDisplay: document.getElementById('wrong-count'),
        progress: document.getElementById('progress'),
        nextBtn: document.getElementById('next-btn'),
        tag: document.getElementById('category-tag'),
        quizArea: document.getElementById('quiz-ui'),
        resultArea: document.getElementById('result-ui'),
        finalScore: document.getElementById('final-score'),
        finalCorrect: document.getElementById('final-correct'),
        finalWrong: document.getElementById('final-wrong'),
        finalGrade: document.getElementById('final-grade'),
        feedbackText: document.getElementById('feedback-text')
    };

    function startQuiz() {
        // Deep copy and shuffle questions
        shuffledQuestions = shuffleArray([...questionBank]);
        currentQuestionIndex = 0;
        correctCount = 0;
        wrongCount = 0;
        
        ui.quizArea.style.display = 'block';
        ui.resultArea.style.display = 'none';
        
        updateStats();
        showQuestion();
    }

    function updateStats() {
        // Update dashboard
        ui.qCounter.textContent = `${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
        ui.correctCountDisplay.textContent = correctCount;
        ui.wrongCountDisplay.textContent = wrongCount;

        // Progress bar
        const pct = ((currentQuestionIndex) / shuffledQuestions.length) * 100;
        ui.progress.style.width = `${pct}%`;
    }

    function showQuestion() {
        const qData = shuffledQuestions[currentQuestionIndex];
        
        // Update UI Text
        ui.question.textContent = qData.q;
        ui.tag.textContent = qData.category;
        
        // Tag Styling
        let tagColor = "rgba(255,255,255,0.1)";
        let tagText = "#94a3b8";
        if(qData.category === "SQL") { tagColor = "rgba(74, 222, 128, 0.2)"; tagText = "#4ade80"; }
        if(qData.category === "JDBC") { tagColor = "rgba(56, 189, 248, 0.2)"; tagText = "#38bdf8"; }
        if(qData.category === "Testning") { tagColor = "rgba(192, 132, 252, 0.2)"; tagText = "#c084fc"; }
        if(qData.category === "DBMS") { tagColor = "rgba(251, 191, 36, 0.2)"; tagText = "#fbbf24"; }
        
        ui.tag.style.background = tagColor;
        ui.tag.style.color = tagText;

        // Shuffle options
        const options = shuffleArray([...qData.options]);
        
        ui.options.innerHTML = ''; 
        ui.nextBtn.style.display = 'none'; 

        options.forEach(optText => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optText;
            btn.onclick = () => handleAnswer(btn, optText, qData.a);
            ui.options.appendChild(btn);
        });
    }

    function handleAnswer(selectedBtn, selectedText, correctText) {
        const allBtns = ui.options.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        if (selectedText === correctText) {
            selectedBtn.classList.add('correct');
            correctCount++;
        } else {
            selectedBtn.classList.add('wrong');
            wrongCount++;
            // Show correct answer
            allBtns.forEach(btn => {
                if (btn.textContent === correctText) {
                    btn.classList.add('correct');
                }
            });
        }

        // Update stats immediately to show result of this question
        ui.correctCountDisplay.textContent = correctCount;
        ui.wrongCountDisplay.textContent = wrongCount;
        
        ui.nextBtn.style.display = 'inline-block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < shuffledQuestions.length) {
            updateStats();
            showQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        ui.quizArea.style.display = 'none';
        ui.resultArea.style.display = 'block';
        
        const total = shuffledQuestions.length;
        ui.finalScore.textContent = `${correctCount} / ${total}`;
        ui.finalCorrect.textContent = correctCount;
        ui.finalWrong.textContent = wrongCount;
        
        const pct = (correctCount / total) * 100;
        let grade = "IG";
        let feedback = "";
        
        if(pct >= 90) { grade = "VG"; feedback = "Fantastiskt! Du spikade det. 🚀"; }
        else if(pct >= 65) { grade = "G"; feedback = "Bra jobbat! Du klarar tentan. 👍"; }
        else if(pct >= 50) { grade = "G-"; feedback = "Godkänt med nöd och näppe. Repetera lite till. 📚"; }
        else { grade = "IG"; feedback = "Tyvärr, du behöver plugga mer på materialet. 🔥"; }
        
        ui.finalGrade.textContent = grade;
        ui.feedbackText.textContent = feedback;
        
        // Color code grade
        if(grade === "VG") ui.finalGrade.className = "stat-value val-green";
        else if(grade.startsWith("G")) ui.finalGrade.className = "stat-value val-blue";
        else ui.finalGrade.className = "stat-value val-red";
    }

    window.onload = startQuiz;

</script>
