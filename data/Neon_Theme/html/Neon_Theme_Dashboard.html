<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Neon Cinematic Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /**
         * ----------------------------------------
         * 1. CSS VARIABLES (Theme: Deep Neon)
         * ----------------------------------------
         */
        :root {
            /* Main Backgrounds */
            --bg-app: #000000;
            --bg-app-image: radial-gradient(circle at 15% 25%, rgba(102, 252, 241, 0.08) 0%, transparent 40%),
                            radial-gradient(circle at 85% 75%, rgba(216, 112, 255, 0.08) 0%, transparent 40%);

            /* Component Backgrounds */
            --bg-header: rgba(0, 0, 0, 0.80);
            --bg-sidebar-left: rgba(0, 0, 0, 0.75);
            --bg-panel: rgba(0, 0, 0, 0.75);
            --bg-panel-opaque: rgba(10, 10, 10, 0.95);
            --bg-input: rgba(0, 0, 0, 0.85);
            --bg-menu: rgba(10, 10, 10, 0.95);
            --bg-card: rgba(15, 15, 15, 0.6);

            /* Button Internals */
            --bg-btn-inner: #000000;

            /* Borders */
            --border-light: rgba(255, 255, 255, 0.08);
            --border-input: rgba(255, 255, 255, 0.1);
            --border-glass: 1px solid rgba(255, 255, 255, 0.05);

            /* Text */
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;

            /* Accents & Gradients */
            --accent-primary: #66fcf1;
            --accent-secondary: #d870ff;
            --grad-text: linear-gradient(90deg, #66fcf1, #d870ff);
            --grad-hover: linear-gradient(135deg, #66fcf1 0%, #d870ff 100%);

            /* Status Colors */
            --status-danger: #ff4d4d;
            --status-warning: #eab308;
            --status-success: #22c55e;

            /* Effects */
            --glass-blur: blur(20px);
            --shadow-panel: 0 10px 40px -10px rgba(0, 0, 0, 1.0), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            --shadow-glow-primary: 0 0 10px rgba(102, 252, 241, 0.1);

            /* Scrollbars */
            --scrollbar-track: rgba(255, 255, 255, 0.02);
            --scrollbar-thumb: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.2);
        }

        /**
         * ----------------------------------------
         * 2. BASE STYLES & RESETS
         * ----------------------------------------
         */
        * {
            box-sizing: border-box;
        }

        *:focus {
            outline: none;
            box-shadow: none;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-app);
            background-image: var(--bg-app-image);
            background-attachment: fixed;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden; /* App-like layout */
        }

        /* Typography Utilities */
        h1, h2, h3, h4, p { margin-top: 0; }
        .text-primary { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        
        .text-gradient {
            background: var(--grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }

        /**
         * ----------------------------------------
         * 3. APPLICATION LAYOUT
         * ----------------------------------------
         */
        .app-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .app-header {
            height: 60px;
            background: var(--bg-header);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 10;
        }

        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .app-sidebar {
            width: 240px;
            background: var(--bg-sidebar-left);
            backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-light);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 5;
        }

        .app-main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            position: relative;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /**
         * ----------------------------------------
         * 4. COMPONENTS (Refactored from Vue/PrimeVue)
         * ----------------------------------------
         */

        /* Cards */
        .card {
            background: var(--bg-card);
            border: var(--border-glass);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            padding: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        }

        .card.interactive:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(40, 40, 40, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.9);
            cursor: pointer;
        }

        /* Generic Buttons */
        .btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: var(--grad-hover);
            border-radius: 9px;
            z-index: -2;
            opacity: 0;
            filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            z-index: -1;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            color: var(--accent-primary);
        }

        .btn:hover::before { opacity: 0.8; }
        .btn:hover::after {
            background: var(--bg-btn-inner);
            border-color: rgba(0, 0, 0, 0.1);
        }

        .btn:active { transform: translateY(0); opacity: 0.9; }

        /* Navigation Buttons */
        .nav-btn {
            color: var(--text-secondary);
            border-radius: 8px;
            position: relative;
            z-index: 1;
            background: transparent;
            border: 1px solid transparent;
            padding: 0.75rem 1rem;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .nav-btn::before {
            content: ''; position: absolute; inset: -1px;
            background: var(--grad-hover); border-radius: 9px;
            z-index: -2; opacity: 0; filter: blur(4px);
            transition: opacity 0.3s ease;
        }

        .nav-btn::after {
            content: ''; position: absolute; inset: 0;
            background: transparent; border-radius: 8px;
            z-index: -1; transition: background 0.3s ease;
        }

        .nav-btn:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .nav-btn:hover::before { opacity: 0.8; }
        .nav-btn:hover::after { background: var(--bg-btn-inner); }

        .nav-btn.active-nav-btn { color: transparent; }
        .nav-btn.active-nav-btn::before { opacity: 0.8; }
        .nav-btn.active-nav-btn::after { background: var(--bg-btn-inner); }
        .nav-btn.active-nav-btn span, 
        .nav-btn.active-nav-btn i {
            background: var(--grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        /* Window Controls */
        .window-close-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .window-close-btn::before {
            content: ''; position: absolute; inset: -1px;
            background: var(--status-danger); border-radius: 9px;
            z-index: -2; opacity: 0; filter: blur(4px);
            transition: opacity 0.3s ease;
        }
        
        .window-close-btn::after {
            content: ''; position: absolute; inset: 0;
            background: transparent; border-radius: 8px;
            z-index: -1; transition: background 0.3s ease;
        }

        .window-close-btn:hover {
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .window-close-btn:hover::before { opacity: 0.8; }
        .window-close-btn:hover::after { background: var(--bg-btn-inner); }

        /* Text Inputs */
        .input-text {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .input-text:focus {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-glow-primary);
        }

        .glass-input {
            backdrop-filter: blur(10px);
        }
        .glass-input:focus {
            border-color: transparent;
            border-image: var(--grad-hover) 1;
        }

        /* Form Controls Group */
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Checkbox (Native CSS implementation of PrimeVue look) */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox {
            appearance: none;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 4px;
            width: 20px;
            height: 20px;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0;
            position: relative;
        }

        .checkbox:hover { border-color: var(--accent-primary); }
        
        .checkbox:checked {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .checkbox:checked::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 10px;
            border: solid var(--bg-app);
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            top: 2px;
        }

        /* Toggle Switch (InputSwitch equivalent) */
        .toggle {
            appearance: none;
            width: 3rem;
            height: 1.5rem;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            margin: 0;
        }

        .toggle::before {
            content: '';
            position: absolute;
            background-color: var(--text-secondary);
            width: 1.1rem;
            height: 1.1rem;
            left: 0.2rem;
            top: 0.15rem;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .toggle:checked {
            background-color: var(--accent-primary);
            border-color: var(--accent-primary);
        }

        .toggle:checked::before {
            background-color: var(--bg-app);
            transform: translateX(1.5rem);
        }

        /* Slider */
        .slider {
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 4px;
            outline: none;
            position: relative;
            margin: 1rem 0;
        }

        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: 2px solid var(--accent-primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            transform: scale(1.2);
            box-shadow: var(--shadow-glow-primary);
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 10px;
            overflow: hidden;
            height: 12px;
        }

        .progress-bar-value {
            height: 100%;
            background: var(--grad-hover);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        /* Chips */
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .chip {
            padding: 0.4rem 1rem;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .collection-chip {
            background: rgba(102, 252, 241, 0.15);
            color: var(--accent-primary);
            border: 1px solid rgba(102, 252, 241, 0.3);
        }

        .lora-chip {
            background: transparent;
            color: var(--text-primary);
            border: none;
            position: relative;
            z-index: 1;
        }

        .lora-chip::before {
            content: ''; position: absolute; inset: -1px;
            background: var(--grad-hover); border-radius: 16px;
            z-index: -2;
        }
        .lora-chip::after {
            content: ''; position: absolute; inset: 0;
            background: var(--bg-btn-inner); border-radius: 16px;
            z-index: -1;
        }

        /* Glass Panel / Dialog */
        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-panel);
            position: relative;
            border-radius: 12px;
            padding: 2rem;
        }

    </style>
</head>
<body>

<div class="app-layout">
    <!-- App Header -->
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
            <i data-lucide="hexagon" style="color: var(--accent-primary);"></i>
            <h2 class="text-gradient" style="margin: 0; font-size: 1.2rem;">DEEP NEON CORE</h2>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button class="window-close-btn" style="color: var(--status-warning);"><i data-lucide="minus"></i></button>
            <button class="window-close-btn" style="color: var(--status-success);"><i data-lucide="maximize-2"></i></button>
            <button class="window-close-btn"><i data-lucide="x"></i></button>
        </div>
    </header>

    <div class="app-body">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <button class="nav-btn active-nav-btn">
                <i data-lucide="layout-dashboard"></i>
                <span>Dashboard</span>
            </button>
            <button class="nav-btn">
                <i data-lucide="image"></i>
                <span>Generations</span>
            </button>
            <button class="nav-btn">
                <i data-lucide="layers"></i>
                <span>Models & LoRAs</span>
            </button>
            <button class="nav-btn">
                <i data-lucide="settings"></i>
                <span>Settings</span>
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="app-main">
            <div style="margin-bottom: 2rem;">
                <h1 class="text-primary" style="font-weight: 800; font-size: 2rem; letter-spacing: -0.02em;">Control Center</h1>
                <p class="text-secondary">Manage your cinematic generation parameters.</p>
            </div>

            <div class="dashboard-grid">
                
                <!-- Card 1: Text Inputs -->
                <div class="card">
                    <h3 class="text-primary" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i data-lucide="type" style="color: var(--accent-secondary); width: 20px;"></i>
                        Prompt Inputs
                    </h3>
                    
                    <div class="form-group">
                        <label>Positive Prompt</label>
                        <textarea class="input-text glass-input" rows="3" placeholder="A cinematic portrait, highly detailed, neon lighting..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Negative Prompt</label>
                        <input type="text" class="input-text" placeholder="blurry, bad anatomy, artifacts..." />
                    </div>

                    <button class="btn" style="width: 100%; justify-content: center;">
                        <i data-lucide="sparkles"></i> Generate Image
                    </button>
                </div>

                <!-- Card 2: Controls -->
                <div class="card interactive">
                    <h3 class="text-primary" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i data-lucide="sliders" style="color: var(--accent-primary); width: 20px;"></i>
                        Parameters
                    </h3>

                    <div class="form-group">
                        <label>Guidance Scale (CFG)</label>
                        <input type="range" class="slider" min="1" max="20" value="7.5" />
                        <div style="display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.8rem;">
                            <span>1.0</span>
                            <span>7.5</span>
                            <span>20.0</span>
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="margin: 0;">High-Res Fix</label>
                        <input type="checkbox" class="toggle" checked />
                    </div>

                    <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="checkbox-wrapper" style="margin: 0;">
                            <input type="checkbox" class="checkbox" checked />
                            <span class="text-primary" style="font-size: 0.9rem;">Save to History</span>
                        </label>
                    </div>
                </div>

                <!-- Card 3: Chips & Progress -->
                <div class="card">
                    <h3 class="text-primary" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i data-lucide="cpu" style="color: var(--text-secondary); width: 20px;"></i>
                        System Status
                    </h3>

                    <div class="form-group">
                        <label>Active LoRAs</label>
                        <div class="chip-container">
                            <span class="chip lora-chip"><i data-lucide="zap" style="width: 14px;"></i> Neon_Cyberpunk_v2</span>
                            <span class="chip lora-chip">Film_Grain_FX</span>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 2rem;">
                        <label>Current Task: <span class="text-gradient">Rendering Pass 2/4</span></label>
                        <div class="progress-bar-container">
                            <div class="progress-bar-value" style="width: 65%;"></div>
                        </div>
                        <p class="text-muted" style="text-align: right; margin-top: 0.5rem; font-size: 0.8rem;">65% Complete</p>
                    </div>

                    <div class="form-group">
                        <div class="chip-container" style="margin-top: 1rem;">
                            <span class="chip collection-chip">GPU: RTX 4090</span>
                            <span class="chip collection-chip">VRAM: 14/24 GB</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script>
    // Initialize Lucide icons
    lucide.createIcons();
</script>
</body>
</html>
