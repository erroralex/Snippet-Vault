<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snippet Vault</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #1e1e1e;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      /* Fade-out class added by main.js before switching windows */
      transition: opacity 0.4s ease-out;
    }

    .container.fade-out {
      opacity: 0;
    }

    /* App wordmark */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      font-size: 28px;
      color: #007acc;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-weight: 600;
      letter-spacing: -2px;
      line-height: 1;
    }

    .app-name {
      font-size: 22px;
      font-weight: 500;
      color: #cccccc;
      letter-spacing: 0.02em;
    }

    /* Animated dots progress indicator */
    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #007acc;
      animation: pulse 1.4s ease-in-out infinite;
      opacity: 0.3;
    }

    .dot:nth-child(1) { animation-delay: 0s; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
      40%            { opacity: 1;   transform: scale(1.3); }
    }

    /* Status text */
    .status {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.04em;
      margin-top: -16px;  /* pull closer to dots */
    }

    /* Thin progress bar at the bottom */
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: #2d2d2d;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 30%;
      background: #007acc;
      border-radius: 0 2px 2px 0;
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0%   { transform: translateX(-100%); width: 30%; }
      50%  { width: 60%; }
      100% { transform: translateX(400%); width: 30%; }
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="wordmark">
      <span class="icon">❰❱</span>
      <span class="app-name">Snippet Vault</span>
    </div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <span class="status" id="status">Starting backend...</span>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>
</body>
</html>
