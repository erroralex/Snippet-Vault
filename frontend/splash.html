<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snippet Vault</title>
    <style>
        /* Inlined theme variables and splash screen styles for reliability */
        :root {
            --bg-app: #000000;
            --bg-app-image: radial-gradient(circle at 15% 25%, rgba(102, 252, 241, 0.08) 0%, transparent 40%), radial-gradient(circle at 85% 75%, rgba(216, 112, 255, 0.08) 0%, transparent 40%);
            --bg-panel: rgba(0, 0, 0, 0.75);
            --border-glass: 1px solid rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-primary: #66fcf1;
            --accent-secondary: #d870ff;
            --grad-text: linear-gradient(90deg, #66fcf1, #d870ff);
            --glass-blur: blur(20px);
            --shadow-panel: 0 10px 40px -10px rgba(0, 0, 0, 1.0), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            --shadow-glow-primary: 0 0 10px rgba(102, 252, 241, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-app);
            background-image: var(--bg-app-image);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            -webkit-app-region: drag;
            user-select: none;
        }

        .splash-container {
            text-align: center;
            background: var(--bg-panel);
            backdrop-filter: var(--glass-blur);
            border: var(--border-glass);
            box-shadow: var(--shadow-panel);
            border-radius: 16px;
            padding: 3rem 4rem;
            animation: fade-in 0.8s ease-out;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: var(--grad-text);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: var(--shadow-glow-primary);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 500;
        }

        .loader {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto;
        }

        .loader-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--accent-primary);
            border-left-color: var(--accent-secondary);
            animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2), inset 0 0 15px rgba(216, 112, 255, 0.2);
        }

        .loader-ring::before {
            content: '';
            position: absolute;
            top: 5px; right: 5px; bottom: 5px; left: 5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-bottom-color: var(--accent-secondary);
            border-right-color: var(--accent-primary);
            animation: spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
        }

        .loader-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: var(--text-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--text-primary), 0 0 20px var(--accent-primary);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; box-shadow: 0 0 15px var(--text-primary), 0 0 30px var(--accent-primary); }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="title">Snippet Vault</div>
        <div class="subtitle">Initializing Development Environment...</div>
        <div class="loader">
            <div class="loader-ring"></div>
            <div class="loader-center"></div>
        </div>
    </div>
</body>
</html>
