<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snippet Vault</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background: radial-gradient(circle at center, #1f1f26 0%, #121214 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f3f4f6;
            overflow: hidden;
            -webkit-app-region: drag;
            user-select: none;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 1.2rem;
            animation: logo-bounce-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 76px;
            height: 76px;
        }

        .hexagon {
            animation: pulse-glow 2.5s ease-in-out infinite alternate;
        }

        .brackets {
            letter-spacing: -1px;
            text-shadow: 0 0 8px rgba(243, 244, 246, 0.4);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 0.4rem 0;
            background: linear-gradient(135deg, #ffffff 0%, #a2a6b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        .subtitle {
            font-size: 0.65rem;
            color: rgba(243, 244, 246, 0.45);
            margin: 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: fade-in-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .loader-bar {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 4px;
            margin-top: 1.8rem;
            overflow: hidden;
            position: relative;
            animation: fade-in 1s ease-out 0.6s both;
        }

        .loader-progress {
            width: 80px;
            height: 100%;
            background: linear-gradient(90deg, #3574f0, #cf8e6d);
            border-radius: 4px;
            position: absolute;
            left: -80px;
            animation: sweep 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 8px rgba(53, 116, 240, 0.4);
        }

        @keyframes logo-bounce-in {
            0% { opacity: 0; transform: scale(0.3) rotate(-15deg); }
            50% { opacity: 0.7; transform: scale(1.05) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        @keyframes pulse-glow {
            0% { filter: drop-shadow(0 0 2px rgba(53, 116, 240, 0.2)) drop-shadow(0 0 4px rgba(207, 142, 109, 0.15)); }
            100% { filter: drop-shadow(0 0 6px rgba(53, 116, 240, 0.5)) drop-shadow(0 0 10px rgba(207, 142, 109, 0.35)); }
        }

        @keyframes sweep {
            0% { left: -80px; }
            100% { left: 180px; }
        }

        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <svg class="logo" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3574f0" />
                        <stop offset="100%" stop-color="#cf8e6d" />
                    </linearGradient>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>
                <polygon class="hexagon" points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#logo-grad)" stroke-width="4.5" />
                <text class="brackets" x="50" y="58" font-family="'Inter', monospace" font-size="26" font-weight="700" fill="#f3f4f6" text-anchor="middle">❰❱</text>
            </svg>
        </div>
        <h1 class="title">Snippet Vault</h1>
        <p class="subtitle">Initializing...</p>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>
</body>
</html>
