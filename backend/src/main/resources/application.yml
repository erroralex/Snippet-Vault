spring:
  datasource:
    url: jdbc:sqlite:${snippetvault.data-dir}/snippet-vault.db
    driver-class-name: org.sqlite.JDBC
  jpa:    
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, shutdown
  endpoint:
    shutdown:
      access: unrestricted
    health:
      show-details: never

snippetvault:
  data-dir: data